---
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      gradle-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
      gradle-minor-major:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
      github-actions-minor-major:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "major"
