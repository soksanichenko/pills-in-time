---
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # assembleRelease also resolves the locked releaseRuntimeClasspath (fails if
      # app/gradle.lockfile is stale after a dependency bump) and runs R8, which is
      # where major bumps such as OkHttp/Retrofit tend to break first.
      # lintDebug is deliberately not run: it reports 75 pre-existing errors. Add it
      # back (or a lint baseline) once those are dealt with.
      - name: Build and unit-test
        run: ./gradlew assembleDebug testDebugUnitTest assembleRelease --console=plain
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
