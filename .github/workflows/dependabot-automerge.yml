---
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Read Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Patch-only PRs and security updates are merged by GitHub once the required
      # CI check passes; minor/major bumps stay manual.
      - name: Enable auto-merge for patch and security updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          IS_SECURITY: ${{ contains(github.event.pull_request.labels.*.name, 'security') }}
          DEPS_JSON: ${{ steps.meta.outputs.updated-dependencies-json }}
        run: |
          if [ "$IS_SECURITY" = 'true' ] \
            || echo "$DEPS_JSON" | jq -e 'all(.[]; .updateType == "version-update:semver-patch")' > /dev/null; then
            gh pr merge --auto --squash "$PR_URL"
          else
            echo 'Not a patch or security update - leaving for manual review.'
          fi
