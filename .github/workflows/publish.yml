---
name: Publish to Play

# Every merge to main that changes the app or its dependencies is built, tested,
# uploaded to the internal track and promoted to alpha (same artifact, same
# versionCode). Production is deliberately not automated.
on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  ci:
    # Skip the bump commit pushed by this workflow and by the local /publish-* flow.
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release)')
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Holds the signing and Play secrets (synced from Infisical); the environment only
    # deploys from protected branches.
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Bump versionCode and write release notes
        id: bump
        run: |
          current=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          next=$((current + 1))
          mkdir -p app/src/main/play/release-notes/en-US
          .github/scripts/release-notes.sh > app/src/main/play/release-notes/en-US/default.txt
          sed -i "s/versionCode = $current/versionCode = $next/" app/build.gradle.kts
          echo "version_code=$next" >> "$GITHUB_OUTPUT"
          cat app/src/main/play/release-notes/en-US/default.txt

      # main requires signed commits and PRs for everyone but admins and the release
      # GitHub App (a bypass actor of the main rulesets). A commit created through the
      # GraphQL API with the app's token is signed by GitHub, so it satisfies both.
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      # Committed before publishing so the repo's versionCode never falls behind Play
      # (a skipped number is harmless, a reused one is rejected). Fails, before anything
      # is uploaded, if main moved on since this run started (expectedHeadOid).
      - name: Commit the bump
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION_CODE: ${{ steps.bump.outputs.version_code }}
        run: |
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg oid "$GITHUB_SHA" \
            --arg headline "chore(release): bump versionCode to $VERSION_CODE, update release notes" \
            --arg gradle "$(base64 -w0 app/build.gradle.kts)" \
            --arg notes "$(base64 -w0 app/src/main/play/release-notes/en-US/default.txt)" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { url } } }",
              variables: { input: {
                branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                expectedHeadOid: $oid,
                message: { headline: $headline },
                fileChanges: { additions: [
                  { path: "app/build.gradle.kts", contents: $gradle },
                  { path: "app/src/main/play/release-notes/en-US/default.txt", contents: $notes }
                ] }
              } }
            }' \
            | gh api graphql --input - --jq '.data.createCommitOnBranch.commit.url' \
            | tee commit-url.txt
          test -s commit-url.txt
          rm commit-url.txt

      - name: Restore signing and Play credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/upload.keystore"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > release-manager-key.json

      - name: Upload to internal
        run: ./gradlew publishReleaseBundle --console=plain

      - name: Promote internal to alpha
        run: ./gradlew promoteReleaseArtifact --from-track internal --promote-track alpha --console=plain

      - name: Remove credentials
        if: always()
        run: rm -f keystore.properties release-manager-key.json "$RUNNER_TEMP/upload.keystore"
